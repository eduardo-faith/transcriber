<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Transcriber{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">🎙️ Transcriber</a>
    <span class="sub">ElevenLabs Scribe · Sprecherzuordnung</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="muted">v{{ version|default('') }}</footer>
</body>
</html>
